<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安安 · 独居老人生活事务提醒与家人协作（可操作原型）</title>
  <meta name="description" content="面向老年人的 AI 日常事务与家庭协作助手 —— 可操作原型" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127968;</text></svg>" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- E0 演示控制条（不在手机画面内，便于评审随时切换） -->
  <header class="demobar" id="demobar">
    <span class="demobar__label">演示控制条</span>
    <span class="demobar__hint">角色切换</span>
    <button type="button" data-demo="role:elder">👵 张阿姨（老人）</button>
    <button type="button" data-demo="role:family">👩 张莉（女儿）</button>
    <span class="demobar__sep"></span>
    <span class="demobar__hint">直达关键状态</span>
    <button type="button" data-demo="go:#/elder/first">① 首次建立协作</button>
    <button type="button" data-demo="go:#/elder/home">② 首页</button>
    <button type="button" data-demo="go:#/elder/voice/med-evening?step=result">③ 识别有误</button>
    <button type="button" data-demo="go:#/elder/waiting/med-evening">④ 等待女儿</button>
    <button type="button" data-demo="go:#/elder/noreply/med-evening">⑤ 女儿未回应</button>
    <button type="button" data-demo="go:#/elder/approve">⑥ 确认改时间</button>
    <button type="button" data-demo="go:#/elder/error/med-evening">⑦ 网络失败</button>
    <button type="button" data-demo="go:#/family/add?step=listening">⑧ 女儿语音录入</button>
    <button type="button" data-demo="go:#/family/log">⑨ 一周记录</button>
    <span class="demobar__sep"></span>
    <button type="button" data-demo="reset" class="is-on">↺ 恢复初始状态</button>
  </header>

  <main class="stage">
    <div class="phone" id="phone" role="application" aria-label="原型画面">
      <div id="app"></div>
    </div>
    <p class="stage__caption" id="caption"></p>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens-elder.js"></script>
  <script src="js/screens-family.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
